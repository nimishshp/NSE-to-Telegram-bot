name: NSE filings to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write             # lets the bot save its posted.json memory file

concurrency:
  group: nse-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NSE and post new filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          pip install --quiet openpyxl xlrd
          python bot.py

      - name: Save memory of posted filings
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Update posted filings"
          git push
